[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node ^20.19.0 || >=22.12.0; pin explicitly so Netlify's
  # own default (which may be older) doesn't fail the build.
  NODE_VERSION = "22"

# React Router uses BrowserRouter (real URL paths, not hash-based), so a
# direct visit or refresh on a client-side route (e.g. /dashboard/leads/:id)
# must be served index.html rather than a 404 from Netlify's static host.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
